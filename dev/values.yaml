replicaCount: 3

image:
  repository: cohavisi/mymath
  tag: "016d3b649de70f6dd739292e891ee003ee4da95d"
  pullPolicy: Always

imagePullSecrets: []

service:
  port: 8080
  nodePort: null

resources: {}

metrics:
  # Enable after publishing the instrumented image and bootstrapping monitoring.
  enabled: true
  port: 9090
  serviceMonitor:
    enabled: true
    releaseLabel: monitoring
    interval: 30s
    scrapeTimeout: 10s
  dashboard:
    enabled: true
  alerts:
    enabled: true
    latencySeconds: 1
    minimumRequestsPerSecond: 0.1
    errorsPerFiveMinutes: 5
