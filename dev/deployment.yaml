apiVersion: apps/v1
kind: Deployment
metadata:
  name: math
spec:
  replicas: 1
  selector:
    matchLabels:
      app: math
  template:
    metadata:
      labels:
        app: math
    spec:
      containers:
        - name: math
          image: cohavisi/mymath:f2a4d2eee012888f19872bd431297d10cba0522e
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
